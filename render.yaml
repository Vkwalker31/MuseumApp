# Render Blueprint: Web + PostgreSQL
# https://render.com/docs/blueprint-spec

databases:
  - name: museum-db
    plan: free
    databaseName: museum
    user: museum

services:
  - type: web
    name: museumapp
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: DJANGO_DEBUG
        value: "0"
      - key: LOGGING_LEVEL
        value: INFO
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: museum-db
          property: connectionString
