{% extends 'base.html' %}
{% block title %}О компании{% endblock %}
{% block content %}
<h1>О компании</h1>
{% for block in blocks %}
  <section>
    <h2>{{ block.title }}</h2>
    <p>{{ block.content|linebreaks }}</p>
  </section>
{% empty %}
  <p>Информация пока не добавлена.</p>
{% endfor %}
{% endblock %}
