{% extends 'base.html' %}
{% block title %}Вход{% endblock %}
{% block content %}
<article>
    <h1>Вход</h1>
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
        <p>
            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}<span>{{ field.errors }}</span>{% endif %}
        </p>
        {% endfor %}
        <button type="submit">Войти</button>
    </form>
    <p><a href="{% url 'pages:register' %}">Регистрация</a></p>
</article>
{% endblock %}
